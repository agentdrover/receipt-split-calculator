# Producer половина подтверждаемого CI-отчёта хаба (#2318).
#
# Этот workflow гоняет код проверяемой ветки, поэтому ключа записи здесь нет:
# только ключ чтения ci_reader для карточки задачи. Коллектор хаба собирает
# результаты AC и validation в hub-ci-results/, артефакт уезжает с прогоном,
# а сам отчёт отправляет доверенный отправитель из main
# (.github/workflows/haiplane-ci-report.yml) после завершения этого прогона.
name: android

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK уже на раннере
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Тесты
        id: tests
        run: ./gradlew --no-daemon test

      - name: Линтер
        id: lint
        run: ./gradlew --no-daemon lint

      - name: Сборка APK
        run: ./gradlew --no-daemon assembleDebug

      # Имена проверок должны покрывать required_checks контракта проекта
      # (lint и tests); лишние из словаря хаба не мешают.
      - name: Собрать результаты для хаба
        if: ${{ always() }}
        continue-on-error: true
        uses: agentdrover/haiplane/.github/actions/hub-ci-report@main
        with:
          hub-url: ${{ secrets.HAIPLANE_HUB_URL }}
          hub-read-token: ${{ secrets.HAIPLANE_HUB_CI_READ_TOKEN }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          event-action: ${{ github.event.action }}
          checks: tests=${{ steps.tests.outcome }},lint=${{ steps.lint.outcome }}

      - name: Загрузить результаты для отправителя
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-ci-results-${{ github.run_attempt }}
          path: hub-ci-results/
          if-no-files-found: ignore
          retention-days: 7
