# Проверка секретов в истории и коде (#2322).
#
# Бинарник gitleaks из релизов, а не marketplace-action: у gitleaks-action
# требуется GITLEAKS_LICENSE для организаций, лишняя зависимость тут ни к чему.
# fetch-depth: 0 обязателен — без полной истории проверять нечего.
name: secrets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          set -euo pipefail
          # Свой каталог вместо /usr/local/bin: не зависим от прав на образе.
          mkdir -p "$RUNNER_TEMP/bin"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Искать утечки
        run: |
          set +e
          # Без --verbose: в публичном репозитории лог видят все, а --verbose
          # печатает контекст находки, то есть куски соседнего содержимого.
          gitleaks git . --no-banner --redact \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Найдены секреты:"
            # Печатаем только место и правило — без самих значений.
            python3 - "$RUNNER_TEMP/gitleaks.json" <<'REPORT'
import json
import sys

with open(sys.argv[1], encoding="utf-8") as handle:
    rows = json.load(handle)
for row in rows:
    print(f"  {row['File']}:{row['StartLine']} — {row['RuleID']}")
print(f"всего: {len(rows)}")
REPORT
            exit 1
          fi
          echo "Утечек не найдено"
