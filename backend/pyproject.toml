[project]
name = "receipts-api"
version = "0.1.0"
description = "API распознавания чеков: фото → структурированные позиции"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "httpx2>=2.16"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
