apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipts-api
  labels:
    app: receipts-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: receipts-api
  template:
    metadata:
      labels:
        app: receipts-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Образ собирается из backend/Dockerfile и публикуется в реестр проекта.
          image: ghcr.io/agentdrover/receipts-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Ключ провайдера живёт только в Secret, в манифесте его нет.
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: receipts-api
                  key: llm-api-key
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: receipts-api
                  key: llm-base-url
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: receipts-api
                  key: llm-model
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
