# Образец Secret. Настоящий создаётся на кластере и в git не попадает:
#   kubectl -n receipts create secret generic receipts-api \
#     --from-literal=llm-api-key=... \
#     --from-literal=llm-base-url=https://api.openai.com/v1 \
#     --from-literal=llm-model=gpt-4o-mini
apiVersion: v1
kind: Secret
metadata:
  name: receipts-api
type: Opaque
stringData:
  llm-api-key: replace-me
  llm-base-url: https://api.openai.com/v1
  llm-model: gpt-4o-mini
